<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><title>NevTech AI</title><style>*{box-sizing:border-box}body{margin:0;padding:8px;background:#080e0c}a{color:#07806a}a:hover{color:#075c4a}h1,h2,h3,p{margin:0}</style></helmet>
<div style="max-width:1800px;margin:auto;background:#f1f4e9;border-radius:17px;overflow:clip;border:1px solid #ffffff10;color:#183c2f;font:16px/1.6 Arial,Helvetica,sans-serif">
<dc-import name="SiteHeader" hint-size="100%,72px"></dc-import>
<main>
<section data-screen-label="Legal header" style="padding:80px 6% 48px;border-bottom:1px solid #173c2a22">
<p style="font:10px/1.5 'Courier New',monospace;text-transform:uppercase;letter-spacing:1.5px;color:#07806a">// {{ eyebrow }}</p>
<h1 style="font:normal clamp(40px,4.8vw,72px)/1.05 Georgia,'Times New Roman',serif;letter-spacing:-2px;margin:16px 0 20px">{{ title }}</h1>
<p style="font-size:16px;line-height:1.7;color:#566d5f;max-width:640px">{{ intro }}</p>
<p style="font:10px/1.9 'Courier New',monospace;text-transform:uppercase;letter-spacing:1px;color:#55745d;margin-top:22px">{{ updated }}</p>
</section>
<section data-screen-label="Legal body" style="padding:56px 6% 80px;display:grid;grid-template-columns:minmax(0,720px);gap:34px">
<sc-for list="{{ sections }}" as="s" hint-placeholder-count="5">
<div style="display:grid;gap:12px;border-top:1px solid #173c2a22;padding-top:22px"><h2 style="font:normal 26px/1.15 Georgia,'Times New Roman',serif;letter-spacing:-.6px">{{ s.h }}</h2><sc-for list="{{ s.p }}" as="t" hint-placeholder-count="1"><p style="font-size:15px;line-height:1.8;color:#3d5a49">{{ t }}</p></sc-for></div>
</sc-for>
</section>
</main>
<dc-import name="SiteFooter" hint-size="100%,380px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { p: null };
  async componentDidMount() {
    const { pages } = await import('./legal-pages.js');
    const slug = new URLSearchParams(location.search).get('page');
    const p = pages[slug] || pages.privacy;
    document.title = p.title + ' — NevTech AI';
    this.setState({ p });
  }
  renderVals() { const p = this.state.p || {}; return { title: p.title, eyebrow: p.eyebrow, intro: p.intro, updated: p.updated, sections: p.sections || [] }; }
}
</script>
</body>
</html>
